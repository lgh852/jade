<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 · Jade</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=block">
<style>
  /* 홈닷 허브(hd-ds · HomeDot 테마) 기준 — 라이트 전용 */
  :root {
    --primary: #5534e1; --primary-hover: #4529c0; --primary-pressed: #351f9e; --primary-ring: #e6e0fd;
    --text-strong: #1a1c20; --text: #2a3038; --text-alt: #555d6d; --text-mute: #868b94;
    --bg-sub: #f3f4f5; --bg-hover: #f7f8f9; --line: #dcdee3; --line-disable: #d1d3d8;
    --red: #ff4242; --red-bg: #feecec; --red-text: #b00c0c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg-hover); color: var(--text);
    font: 14px/22px Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  button, input { font-family: inherit; }
  .ms { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; display: inline-block; }
  .top { height: 60px; flex: none; display: flex; align-items: center; padding: 0 32px; background: #fff; border-bottom: 1px solid var(--line); }
  .logo { display: inline-flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; color: var(--text-strong); }
  .logo i { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
  .card { width: 100%; max-width: 440px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 40px; }
  h1 { font-size: 24px; line-height: 38px; font-weight: 700; color: var(--text-strong); margin: 0; }
  .desc { color: var(--text-alt); font-size: 14px; line-height: 22px; margin: 4px 0 32px; }
  label { display: block; font-size: 14px; line-height: 22px; font-weight: 500; color: var(--text); margin: 0 0 4px; }
  .field { margin-bottom: 20px; }
  .input { position: relative; }
  input { width: 100%; height: 48px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text);
    font-size: 16px; line-height: 24px; outline: none; transition: border-color .12s, box-shadow .12s; }
  input::placeholder { color: var(--text-mute); }
  input:hover { box-shadow: 0 2px 8px rgba(42,48,56,.1); }
  input:focus { border-color: var(--primary); box-shadow: none; }
  .pw input { padding-right: 48px; }
  .pw button { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border: none; border-radius: 6px; background: transparent;
    color: var(--text-mute); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .pw button:hover { background: var(--bg-sub); color: var(--text); }
  .err { display: none; gap: 8px; align-items: flex-start; white-space: pre-line; margin: 0 0 20px; padding: 12px 16px; border-radius: 8px;
    background: var(--red-bg); color: var(--red-text); font-size: 14px; line-height: 22px; }
  .err.show { display: flex; }
  .err .ms { font-size: 20px; margin-top: 1px; color: var(--red); }
  .submit { width: 100%; height: 48px; margin-top: 12px; border: 1px solid var(--primary); border-radius: 6px; background: var(--primary); color: #fff;
    font-size: 16px; line-height: 24px; font-weight: 500; cursor: pointer; transition: background .12s; }
  .submit:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .submit:active { background: var(--primary-pressed); }
  .submit:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--primary-ring); }
  .submit:disabled { background: var(--line-disable); border-color: var(--line-disable); cursor: default; }
  .note { display: flex; align-items: center; justify-content: center; gap: 4px; margin: 16px 0 0; color: var(--text-mute); font-size: 12px; line-height: 19px; }
  .note .ms { font-size: 16px; }
  html.restoring main { visibility: hidden; }
  /* 휴대폰: 카드 없이 흰 화면 전체, 노치·홈 바 여백 */
  @media (max-width: 600px) {
    body { background: #fff; }
    .top { height: calc(56px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 20px 0; border-bottom: none; }
    main { align-items: flex-start; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); }
    .card { border: none; border-radius: 0; padding: 0; max-width: none; }
    .desc { margin-bottom: 28px; }
  }
</style>
<script>document.documentElement.classList.add('restoring'); setTimeout(function () { document.documentElement.classList.remove('restoring'); }, 3000);</script>
</head>
<body>
<header class="top"><span class="logo"><i></i>Jade</span></header>
<main>
<section class="card">
  <h1>로그인</h1>
  <p class="desc">JadeHR 아이디와 비밀번호로 로그인하세요.</p>
  <form id="loginForm" novalidate>
    <div class="err" id="err" role="alert"></div>
    <div class="field">
      <label for="id">아이디</label>
      <div class="input"><input id="id" name="id" placeholder="JadeHR 아이디" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus></div>
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <div class="input pw">
        <input id="password" name="password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
        <button type="button" id="togglePw" aria-label="비밀번호 보기"><span class="ms">visibility</span></button>
      </div>
    </div>
    <button class="submit" id="submit" type="submit">로그인</button>
  </form>
  <p class="note"><span class="ms" aria-hidden="true">lock</span>JadeHR에 실제로 로그인해 확인합니다.</p>
</section>
</main>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  // 로그인 뒤 돌아갈 곳: 같은 사이트 경로만 허용
  var next = new URLSearchParams(location.search).get('next') || '';
  if (!/^\/(?!\/)/.test(next) || next.indexOf('/login.html') === 0) next = '/calendar.html';

  // 토큰 백업(브라우저 저장소) — 쿠키가 지워져도 다시 로그인하지 않게
  var TOKEN_KEY = 'jade.token', TOKEN_AT = 'jade.tokenAt';
  function saveToken(t) { try { localStorage.setItem(TOKEN_KEY, t); localStorage.setItem(TOKEN_AT, String(Date.now())); } catch (e) {} }
  function storedToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
  function dropToken() { try { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(TOKEN_AT); } catch (e) {} }
  function showForm() { document.documentElement.classList.remove('restoring'); }

  // 이미 로그인돼 있으면 바로 이동. 쿠키가 없으면 저장해 둔 토큰으로 쿠키를 다시 받는다.
  fetch('/api/auth/me', { headers: { 'Accept': 'application/json' } })
    .then(function (res) {
      if (res.ok) { location.replace(next); return; }
      var t = storedToken();
      if (!t) { showForm(); return; }
      return fetch('/api/auth/refresh', { method: 'POST', headers: { 'Accept': 'application/json', 'Authorization': 'Bearer ' + t } })
        .then(function (r) {
          if (!r.ok) { dropToken(); showForm(); return; }
          return r.json().then(function (b) { if (b.token) saveToken(b.token); location.replace(next); });
        });
    })
    .catch(showForm);

  function showError(msg) {
    var el = $('#err');
    el.innerHTML = msg ? '<span class="ms" aria-hidden="true">error</span>' : '';
    if (msg) { var t = document.createElement('span'); t.textContent = msg; el.appendChild(t); }
    el.classList.toggle('show', !!msg);
  }

  $('#togglePw').addEventListener('click', function () {
    var pw = $('#password');
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    this.innerHTML = '<span class="ms">' + (show ? 'visibility_off' : 'visibility') + '</span>';
    this.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 보기');
  });

  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var id = $('#id').value.trim();
    var password = $('#password').value;
    if (!id) { showError('아이디를 입력하세요.'); $('#id').focus(); return; }
    if (!password) { showError('비밀번호를 입력하세요.'); $('#password').focus(); return; }
    showError('');
    $('#submit').disabled = true;
    $('#submit').textContent = '확인 중…';
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, password: password })
    })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          if (!res.ok) throw new Error(body.message || ('로그인 실패 (HTTP ' + res.status + ')'));
          if (body.token) saveToken(body.token);
          location.replace(next);
        });
      })
      .catch(function (err) {
        showError(err.message);
        $('#password').select();
        $('#submit').disabled = false;
        $('#submit').textContent = '로그인';
      });
  });
})();
</script>
</body>
</html>
